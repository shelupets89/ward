name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege, declared explicitly rather than inherited from the repository
# default. CI only ever needs to read the checkout.
#
# Note this is `pull_request`, never `pull_request_target`: fork PRs therefore
# run with a read-only token and no access to secrets, even though the jobs
# execute scripts from the PR's own branch.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    # Swift Testing (`import Testing`) ships with the Swift 6 toolchain, so this
    # needs an Xcode 16+ image. The guard below fails loudly if that changes.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Require Swift 6+ for Swift Testing
        run: |
          SWIFT_MAJOR="$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9]*\).*/\1/p' | head -1)"
          if [ -z "${SWIFT_MAJOR}" ] || [ "${SWIFT_MAJOR}" -lt 6 ]; then
            echo "::error::Swift 6+ required (Tests use the Swift Testing framework); found: $(swift --version 2>&1 | head -1)"
            exit 1
          fi

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      - name: Coverage gate (WardCore)
        run: bash scripts/coverage.sh 85

  package:
    name: Package app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Proves the release path still works on every change — a broken
      # make-app.sh should not be discovered at tag time.
      - name: Build .app bundle
        run: bash scripts/make-app.sh

      - name: Verify bundle identity
        run: |
          codesign --verify --deep --strict dist/Ward.app
          ACTUAL_ID="$(codesign -dv dist/Ward.app 2>&1 | sed -n 's/^Identifier=//p')"
          if [ "${ACTUAL_ID}" != "com.dimashelupets.ward" ]; then
            echo "::error::Unexpected bundle identifier: ${ACTUAL_ID}"
            exit 1
          fi
          echo "Bundle identifier: ${ACTUAL_ID}"

      - name: Build .dmg
        run: bash scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Ward-unsigned
          path: |
            dist/*.dmg
            dist/*-INSTRUCTIONS.txt
          if-no-files-found: error

  formula:
    name: Homebrew formula
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The tap's formula is rendered, never hand-edited, so what needs guarding
      # is that the template still renders to something Homebrew accepts. It is
      # rendered against the newest release because only a real tarball produces
      # a real checksum — a placeholder would make the audit meaningless.
      - name: Render the formula for the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG="$(gh release view --json tagName --jq .tagName)"
          echo "Rendering against ${LATEST_TAG}"
          brew tap-new shelupets89/ward --no-git
          bash scripts/render-formula.sh "${LATEST_TAG}" \
            "$(brew --repository)/Library/Taps/shelupets89/homebrew-ward/Formula/ward.rb"

      - name: brew style
        run: brew style shelupets89/ward

      # `--online` reaches the GitHub API, which rate-limits unauthenticated
      # runners hard enough to make this job flaky without a token.
      - name: brew audit
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew audit --strict --online shelupets89/ward/ward

      # Auditing proves the formula parses; only installing proves it builds.
      # The distinction is not academic — the nested-sandbox failure this
      # packaging exists to work around reproduces *only* inside Homebrew's
      # build sandbox, so nothing short of a real `brew install` would catch it
      # coming back. Pointed at this commit rather than the last release,
      # because the last release is not what the PR changed.
      - name: Prove this commit installs through Homebrew
        run: |
          # Named ward-<version>.tar.gz so Homebrew infers the version the same
          # way it does from a release tarball, which also lets the formula's
          # own test compare it against Info.plist.
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Support/Info.plist)"
          TARBALL="${RUNNER_TEMP}/ward-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="ward-${VERSION}/" -o "${TARBALL}" HEAD
          sed -e "s|__URL__|file://${TARBALL}|" \
              -e "s|__SHA256__|$(shasum -a 256 "${TARBALL}" | awk '{print $1}')|" \
              packaging/homebrew/ward.rb.template \
              > "$(brew --repository)/Library/Taps/shelupets89/homebrew-ward/Formula/ward.rb"
          brew install --build-from-source shelupets89/ward/ward
          brew test shelupets89/ward/ward

      - name: Nothing downloaded means nothing quarantined
        run: bash scripts/check-no-quarantine.sh "$(brew --prefix ward)/Ward.app"

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These scripts write to /etc/sudoers.d and run commands as root, so they
      # get linted even though the app itself is macOS-only.
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --severity=warning scripts/*.sh
