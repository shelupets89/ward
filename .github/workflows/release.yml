name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

# GITHUB_REF_NAME is set on a manual dispatch too — to the branch the run was
# started from — so a `${GITHUB_REF_NAME:-inputs.tag}` fallback never reaches the
# input, and the tag box is silently ignored.
#
# Declared once for the whole workflow rather than per job: both jobs need it,
# and two copies of this expression are two places a future trigger change has to
# be kept in step. Missing one would silently give that job the wrong ref.
env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      # `ref` for the same reason TAG is computed above: on a dispatch the branch
      # the run started from is not the tag being released, and everything below
      # reads this tree — including the Info.plist the version check compares the
      # tag against. On a tag push github.ref_name is the tag, so this is a no-op.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # The tap is published by a later job, but a missing token discovered
      # there would surface only after this job has made the release public —
      # and the release notes tell people to `brew install`. Checking first is
      # what makes that ordering claim true.
      - name: Require the tap token before anything is published
        env:
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          if [ -z "${TAP_PUSH_TOKEN}" ]; then
            echo "::error::TAP_PUSH_TOKEN is not set. Create a fine-grained PAT with Contents:write on shelupets89/homebrew-ward and add it as a repository secret."
            exit 1
          fi

      - name: Test before releasing
        run: swift test

      - name: Build .dmg
        run: bash scripts/make-dmg.sh

      - name: Check tag matches the bundle version
        run: |
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Support/Info.plist)"
          if [ "${TAG}" != "v${BUNDLE_VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match Info.plist version ${BUNDLE_VERSION}. Bump one of them."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            dist/*.dmg \
            dist/*-INSTRUCTIONS.txt \
            --title "Ward ${TAG}" \
            --generate-notes \
            --notes-file - <<'NOTES'
          ## Install

          ```bash
          brew install shelupets89/ward/ward && ward
          ```

          `ward` links it into `/Applications` and opens it, which Homebrew's own
          sandbox is not allowed to do during the install.

          Installing compiles Ward on your machine: nothing is downloaded, so nothing
          is quarantined, and there is no Gatekeeper dialog to get past. Linking is a
          separate command because Homebrew's own sandbox is not allowed to write to
          `/Applications`.

          ## Or the download below

          Ward is **not notarized** (that needs a paid Apple Developer ID), so macOS
          will refuse to open the download:

          > "Apple could not verify Ward-x.y.z.dmg is free of malware…"

          That dialog offers only **Move to Trash** and **Done**. This is expected and
          is not a sign anything is wrong with the file. Two ways past it:

          ```bash
          xattr -d com.apple.quarantine ~/Downloads/Ward-*.dmg
          ```

          Or: click **Done**, then System Settings → Privacy & Security → scroll to
          Security → **Open Anyway**.

          Either route is you telling macOS to trust a file it cannot verify. Only do
          that if you trust the source.

          **Or build it by hand**, if you would rather not use Homebrew. Same
          reason it works — a locally built app is never quarantined:

          ```bash
          git clone https://github.com/${{ github.repository }} && cd ward
          bash scripts/make-app.sh && open dist/Ward.app
          ```

          See `INSTRUCTIONS.txt` below, and the README for first-run permissions.
          NOTES

  update-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: macos-15
    # Nothing here writes to this repository — the only write is to the tap, via
    # TAP_PUSH_TOKEN. This job runs `brew install`, which executes Homebrew's own
    # Ruby against the network, so the ambient token it can reach should not be
    # one that could rewrite Ward itself.
    permissions:
      contents: read
    env:
      # A tap is `owner/name`; its repository is `owner/homebrew-name`, and
      # Homebrew checks it out under Library/Taps at the repository's own path.
      # Both spellings are needed, so both are named once here — `brew style`
      # takes the tap and reports "0 files inspected" with exit 0 when handed a
      # tap that does not exist, so a literal drifting out of step with
      # `brew tap-new` would silently retire this job's metadata gate.
      TAP_NAME: shelupets89/ward
      TAP_REPO: shelupets89/homebrew-ward
      FORMULA_PATH: Formula/ward.rb
    steps:
      # Same reason as the release job's checkout above, but a different stake:
      # here render-formula.sh reads the template out of the checked-out tree
      # while building `url` from ${TAG} alone, so a wrong ref pins the formula
      # body of one commit to another commit's tarball — and every step below
      # still passes, because nothing else re-derives the template.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Render the formula for this tag
        run: |
          brew tap-new "${TAP_NAME}" --no-git
          echo "RENDERED=$(brew --repository)/Library/Taps/${TAP_REPO}/${FORMULA_PATH}" >> "${GITHUB_ENV}"

      - name: Fill in the tag's url and checksum
        run: bash scripts/render-formula.sh "${TAG}" "${RENDERED}"

      # `brew install` never reads the metadata stanzas, so a typo'd SPDX id or a
      # malformed `desc` would install, test, and ship. ci.yml gates on these —
      # but ci.yml never sees the file that reaches users, which is this one.
      #
      # What this cannot do is check that a value is *true*. Homebrew's licence
      # cross-check is gated on `@core_tap`, so for a third-party tap it is
      # unreachable and no flag re-enables it: `license "MIT"` against a GPL repo
      # audits clean. Malformed metadata is caught here; wrong metadata is not.
      - name: brew style
        run: brew style "${TAP_NAME}"

      # `--online` reaches the GitHub API, which rate-limits unauthenticated
      # runners hard enough to make this flaky without a token.
      - name: brew audit
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew audit --strict --online "${TAP_NAME}/ward"

      # A formula is only as good as the install it produces, and the failure
      # mode this guards against is silent: the tap keeps serving a formula that
      # no longer builds. Testing before the push means a broken one never lands.
      - name: Prove the formula installs
        run: |
          brew install --build-from-source "${TAP_NAME}/ward"
          brew test "${TAP_NAME}/ward"
          # Pinned here rather than recomputed at publish time, so "the formula
          # that was tested" names these exact bytes and not whatever is on disk
          # by the time the PUT runs. Without it, anything added between this
          # step and the publish that rewrote the formula — a `--fix` alongside
          # the `brew style` step is the obvious candidate — would be verified
          # against itself and pass.
          # Assigned bare before it is echoed, for the same reason the publish
          # step splits its base64: inside `echo "X=$(cmd)"` the substitution is
          # an argument, so a failure would print `PROVEN_BLOB=` and carry on.
          PROVEN_BLOB="$(git hash-object "${RENDERED}")"
          echo "PROVEN_BLOB=${PROVEN_BLOB}" >> "${GITHUB_ENV}"

      - name: Nothing downloaded means nothing quarantined
        run: bash scripts/check-no-quarantine.sh "$(brew --prefix ward)/Ward.app"

      - name: Publish the formula to the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          # `gh api` prints the error body to stdout on a non-2xx response, so
          # `--jq .sha ... || true` hands the PUT a blob of JSON as the blob SHA
          # — which is exactly what happens on the first release, when there is
          # no formula to replace. Only a genuine 404 means "not there yet";
          # anything else is a failure worth stopping for.
          API_ERROR="${RUNNER_TEMP}/tap-sha-error.txt"
          if CURRENT_SHA="$(gh api "repos/${TAP_REPO}/contents/${FORMULA_PATH}" --jq .sha 2> "${API_ERROR}")"; then
            echo "Replacing the formula already in the tap (blob ${CURRENT_SHA})"
          elif grep -q "HTTP 404" "${API_ERROR}"; then
            CURRENT_SHA=""
            echo "No formula in the tap yet — creating it"
          else
            echo "::error::Could not read ${TAP_REPO}/${FORMULA_PATH}:"
            cat "${API_ERROR}"
            exit 1
          fi

          # This step sets no `shell:`, and neither does the job, so it runs
          # under the Actions default of `bash -e {0}` — pipefail off, as the
          # run log states verbatim. Inline as `-f content="$(base64 … | tr …)"`
          # the pipeline reported `tr`'s status, which is always 0, and a failed
          # command substitution used as an argument does not trip `set -e`
          # either — an unreadable RENDERED would have PUT an empty body and
          # printed a commit URL for a 0-byte formula on the live tap. Split so
          # `set -e` sees base64's own status. macOS base64 does not wrap, but
          # GNU base64 does, so the newline strip stays for a Linux runner —
          # done as a parameter expansion rather than a second pipe to hide an
          # error behind.
          if [ ! -s "${RENDERED}" ]; then
            echo "::error::${RENDERED} is empty or missing — refusing to publish it."
            exit 1
          fi
          if [ "$(git hash-object "${RENDERED}")" != "${PROVEN_BLOB}" ]; then
            echo "::error::${RENDERED} has changed since it was installed and tested — refusing to publish something nothing has proven."
            exit 1
          fi
          WRAPPED_CONTENT="$(base64 -i "${RENDERED}")"
          CONTENT="${WRAPPED_CONTENT//$'\n'/}"

          PUT_RESULT="$(gh api --method PUT "repos/${TAP_REPO}/contents/${FORMULA_PATH}" \
            -f message="🍺 chore(formula): ward ${TAG}" \
            -f content="${CONTENT}" \
            ${CURRENT_SHA:+-f sha="${CURRENT_SHA}"} \
            --jq '[.content.sha, .commit.html_url] | @tsv')"
          IFS=$'\t' read -r PUBLISHED_BLOB COMMIT_URL <<< "${PUT_RESULT}"

          # Any 2xx prints a commit URL whatever bytes it stored, so the URL on
          # its own is not evidence the tap serves what was tested here. The
          # response's blob id is git's hash of what the tap now holds, and
          # PROVEN_BLOB is that same hash taken of the file `brew test` passed
          # against — so equality is a byte-for-byte claim reaching back to the
          # thing that was actually proven, not to the file as it stands now.
          if [ "${PUBLISHED_BLOB}" != "${PROVEN_BLOB}" ]; then
            echo "::error::${TAP_REPO}/${FORMULA_PATH} is now blob ${PUBLISHED_BLOB}, but the formula that was installed and tested is ${PROVEN_BLOB} — the tap is not serving what was proven."
            exit 1
          fi

          echo "${COMMIT_URL}"
