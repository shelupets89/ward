name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test before releasing
        run: swift test

      - name: Build .dmg
        run: bash scripts/make-dmg.sh

      - name: Check tag matches the bundle version
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Support/Info.plist)"
          if [ "${TAG}" != "v${BUNDLE_VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match Info.plist version ${BUNDLE_VERSION}. Bump one of them."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          gh release create "${TAG}" \
            dist/*.dmg \
            dist/*-INSTRUCTIONS.txt \
            --title "Ward ${TAG}" \
            --generate-notes \
            --notes-file - <<'NOTES'
          ## Install

          ```bash
          brew install shelupets89/ward/ward
          ```

          This compiles Ward on your machine. Nothing is downloaded, so nothing is
          quarantined, and there is no Gatekeeper dialog to get past. Homebrew prints
          a `ln -s` line at the end to put it in `/Applications` — its sandbox is not
          allowed to do that for you.

          ## Or the download below

          Ward is **not notarized** (that needs a paid Apple Developer ID), so macOS
          will refuse to open the download:

          > "Apple could not verify Ward-x.y.z.dmg is free of malware…"

          That dialog offers only **Move to Trash** and **Done**. This is expected and
          is not a sign anything is wrong with the file. Two ways past it:

          ```bash
          xattr -d com.apple.quarantine ~/Downloads/Ward-*.dmg
          ```

          Or: click **Done**, then System Settings → Privacy & Security → scroll to
          Security → **Open Anyway**.

          Either route is you telling macOS to trust a file it cannot verify. Only do
          that if you trust the source.

          **Or build it by hand**, if you would rather not use Homebrew. Same
          reason it works — a locally built app is never quarantined:

          ```bash
          git clone https://github.com/${{ github.repository }} && cd ward
          bash scripts/make-app.sh && open dist/Ward.app
          ```

          See `INSTRUCTIONS.txt` below, and the README for first-run permissions.
          NOTES

  update-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN is scoped to this repository, and the tap is a second one.
      # Failing here beats failing after the release is already public.
      - name: Require a tap token
        run: |
          if [ -z "${{ secrets.TAP_PUSH_TOKEN }}" ]; then
            echo "::error::TAP_PUSH_TOKEN is not set. Create a fine-grained PAT with Contents:write on shelupets89/homebrew-ward and add it as a repository secret."
            exit 1
          fi

      - name: Render the formula for this tag
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          brew tap-new shelupets89/ward --no-git
          bash scripts/render-formula.sh "${TAG}" \
            "$(brew --repository)/Library/Taps/shelupets89/homebrew-ward/Formula/ward.rb"

      # A formula is only as good as the install it produces, and the failure
      # mode this guards against is silent: the tap keeps serving a formula that
      # no longer builds. Testing before the push means a broken one never lands.
      - name: Prove the formula installs
        run: |
          brew install --build-from-source shelupets89/ward/ward
          brew test shelupets89/ward/ward

      - name: Nothing downloaded means nothing quarantined
        run: |
          APP="$(brew --prefix ward)/Ward.app"
          if xattr -r "${APP}" | grep -q com.apple.quarantine; then
            echo "::error::${APP} carries com.apple.quarantine — the install path no longer avoids Gatekeeper."
            exit 1
          fi
          echo "No quarantine attribute on ${APP}"

      - name: Publish the formula to the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          TAP_REPO: shelupets89/homebrew-ward
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          FORMULA="$(brew --repository)/Library/Taps/shelupets89/homebrew-ward/Formula/ward.rb"

          CURRENT_SHA="$(gh api "repos/${TAP_REPO}/contents/Formula/ward.rb" --jq .sha 2>/dev/null || true)"
          gh api --method PUT "repos/${TAP_REPO}/contents/Formula/ward.rb" \
            -f message="🍺 chore(formula): ward ${TAG}" \
            -f content="$(base64 -i "${FORMULA}" | tr -d '\n')" \
            ${CURRENT_SHA:+-f sha="${CURRENT_SHA}"} \
            --jq .commit.html_url
